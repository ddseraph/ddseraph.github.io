name: 渲染公告板

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 安装 Pillow
        run: pip install Pillow

      - name: 渲染公告板
        env:
          GAODE_KEY: ${{ secrets.GAODE_KEY }}
        run: python cloud_render.py

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
